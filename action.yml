name: OCaml CI setup
description: Restore or build a cached opam switch, then export its environment.

inputs:
  ocaml-compiler:
    description: OCaml compiler version, passed to ocaml/setup-ocaml.
    required: true
  pins:
    description: |
      One "<name> <url>" per line, pinned with `opam pin add <name> <url> -yn`. Kept out of the .opam files because opam-repository rejects pin-depends.
    default: ''
  with-test:
    description: "'true' adds --with-test to the dependency install."
    default: 'true'
  with-doc:
    description: "'true' adds --with-doc to the dependency install."
    default: 'false'
  with-dev-setup:
    description: "'true' adds --with-dev-setup to the dependency install."
    default: 'false'
  extra-packages:
    description: Space-separated packages installed together with the dependencies, so the cache holds them.
    default: ''
  opam-disable-sandboxing:
    description: Passed to ocaml/setup-ocaml.
    default: 'true'
  cache-period:
    description: |
      `date` format whose output goes into the exact cache key. A new value gives a new key, so the next run restores the old switch, runs `opam update` and saves again. The default refreshes monthly; `%G-%V` refreshes weekly. Empty never refreshes.
    default: '%Y-%m'

outputs:
  cache-hit:
    description: "'true' when this call restored the exact opam cache key, else 'false'. A second call in the same job skips the restore and reports 'false'."
    value: ${{ steps.restore.outputs.cache-hit == 'true' && 'true' || 'false' }}
  cache-matched-key:
    description: Key of the restored opam cache. Empty on a full miss.
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - name: Compute opam cache key
      id: key
      shell: bash
      env:
        PINS: ${{ inputs.pins }}
        WITH_TEST: ${{ inputs.with-test }}
        WITH_DOC: ${{ inputs.with-doc }}
        WITH_DEV_SETUP: ${{ inputs.with-dev-setup }}
        EXTRAS: ${{ inputs.extra-packages }}
        COMPILER: ${{ inputs.ocaml-compiler }}
        SANDBOX: ${{ inputs.opam-disable-sandboxing }}
        PERIOD: ${{ inputs.cache-period }}
        OPAM_FILES_HASH: ${{ hashFiles('*.opam', '*.opam.locked', 'dune-project') }}
      run: |
        while read -r name url extra; do
          if [[ -z "$name" ]]; then continue; fi
          if [[ -z "$url" || -n "$extra" ]]; then
            echo "::error::pins line must be '<name> <url>': $name $url $extra"
            exit 1
          fi
        done <<< "$PINS"

        image="${ImageOS:-$(. /etc/os-release 2>/dev/null; echo "${ID:-}-${VERSION_ID:-}")}"
        # Keep the version equal to the `uses:` line below.
        prefix="opam-$RUNNER_OS-$RUNNER_ARCH-$image-$COMPILER-setup-ocaml-3.9.0-sandbox-$SANDBOX-"
        if command -v sha256sum > /dev/null; then sha=(sha256sum); else sha=(shasum -a 256); fi
        digest="$(printf '%s\n' "$PINS" "$WITH_TEST" "$WITH_DOC" "$WITH_DEV_SETUP" "$EXTRAS" "$OPAM_FILES_HASH" "${ImageVersion:-}" "$(date -u +"$PERIOD")" | "${sha[@]}")"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix${digest%% *}" >> "$GITHUB_OUTPUT"

        if [[ "${GH_CI_OCAML_READY:-}" == "$COMPILER" ]]; then ready=true; else ready=false; fi
        echo "setup-done=$ready" >> "$GITHUB_OUTPUT"

    - name: Allow native symlinks
      if: runner.os == 'Windows' && steps.key.outputs.setup-done != 'true'
      shell: bash
      run: |
        fsutil behavior set symlinkEvaluation R2L:1 R2R:1
        echo "HOME=$USERPROFILE"         >> "$GITHUB_ENV"
        echo "MSYS=winsymlinks:native"   >> "$GITHUB_ENV"
        echo "CYGWIN=winsymlinks:native" >> "$GITHUB_ENV"

    - name: Load opam cache
      id: restore
      if: steps.key.outputs.setup-done != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ runner.tool_cache }}/opam
          ~/.opam
          C:\.opam
          _opam
          .opam-dir
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Use OCaml ${{ inputs.ocaml-compiler }}
      if: steps.restore.outputs.cache-matched-key == '' && steps.key.outputs.setup-done != 'true'
      uses: ocaml/setup-ocaml@v3.9.0
      with:
        ocaml-compiler: ${{ inputs.ocaml-compiler }}
        opam-disable-sandboxing: ${{ inputs.opam-disable-sandboxing }}

    - name: Record opam directory
      if: steps.restore.outputs.cache-matched-key == '' && steps.key.outputs.setup-done != 'true'
      shell: bash
      run: |
        dir="$(dirname "$(command -v opam)")"
        if [[ "$RUNNER_OS" == "Windows" ]]; then cygpath -w "$dir" > .opam-dir; else echo "$dir" > .opam-dir; fi

    - name: Use cached opam environment
      if: steps.restore.outputs.cache-matched-key != ''
      shell: bash
      run: |
        # Same values as setup-ocaml v3.9.0 (src/installer.ts).
        echo "OPAMCONFIRMLEVEL=unsafe-yes"         >> "$GITHUB_ENV"
        echo "OPAMDOWNLOADJOBS=$(nproc 2> /dev/null || sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
        echo "OPAMEXTERNALSOLVER=builtin-0install" >> "$GITHUB_ENV"
        echo "OPAMPRECISETRACKING=1"               >> "$GITHUB_ENV"
        echo "OPAMRETRIES=10"                      >> "$GITHUB_ENV"
        echo "OPAMSOLVERTIMEOUT=600"               >> "$GITHUB_ENV"
        echo "OPAMYES=1"                           >> "$GITHUB_ENV"

        cat .opam-dir >> "$GITHUB_PATH"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo 'OPAMROOT=C:\.opam'                       >> "$GITHUB_ENV"
          echo 'BASH_ENV=C:\.opam\.cygwin\root\bash_env' >> "$GITHUB_ENV"
          echo 'C:\.opam\.cygwin\root\bin'               >> "$GITHUB_PATH"
        fi

    - name: Remember OCaml setup
      shell: bash
      env:
        COMPILER: ${{ inputs.ocaml-compiler }}
      run: echo "GH_CI_OCAML_READY=$COMPILER" >> "$GITHUB_ENV"

    - name: Install opam dependencies
      shell: bash
      env:
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        PINS: ${{ inputs.pins }}
        WITH_TEST: ${{ inputs.with-test }}
        WITH_DOC: ${{ inputs.with-doc }}
        WITH_DEV_SETUP: ${{ inputs.with-dev-setup }}
        EXTRAS: ${{ inputs.extra-packages }}
        STALE_RESTORE: ${{ steps.restore.outputs.cache-matched-key != '' }}
      run: |
        flags=()
        if [[ "$WITH_TEST" == "true" ]]; then flags+=(--with-test); fi
        if [[ "$WITH_DOC" == "true" ]]; then flags+=(--with-doc); fi
        if [[ "$WITH_DEV_SETUP" == "true" ]]; then flags+=(--with-dev-setup); fi
        read -r -a extras <<< "$EXTRAS"

        if [[ "$CACHE_HIT" == "true" ]]; then
          # Empty apt lists on a fresh runner: opam only warns.
          if [[ "$RUNNER_OS" == "Linux" ]]; then opam update --depexts; fi
          opam install . --deps-only --depext-only "${flags[@]}" "${extras[@]}"
          exit 0
        fi

        while read -r name url _; do
          if [[ -z "$name" ]]; then continue; fi
          opam pin add "$name" "$url" -yn
        done <<< "$PINS"

        if [[ "$STALE_RESTORE" == "true" ]]; then opam update; fi

        opam install . --deps-only "${flags[@]}" "${extras[@]}"

    - name: Clean opam root
      if: steps.restore.outputs.cache-hit != 'true' && steps.key.outputs.setup-done != 'true'
      shell: bash
      run: |
        opam clean --all-switches --download-cache --logs --repo-cache --untracked --unused-repositories

    - name: Save opam cache
      if: steps.restore.outputs.cache-hit != 'true' && steps.key.outputs.setup-done != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ runner.tool_cache }}/opam
          ~/.opam
          C:\.opam
          _opam
          .opam-dir
        key: ${{ steps.key.outputs.key }}
