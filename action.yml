name: OCaml CI setup
description: Restore or build a cached opam switch, then export its environment.

inputs:
  ocaml-compiler:
    description: OCaml compiler version, passed to ocaml/setup-ocaml.
    required: true
  pins:
    description: |
      One "<name> <url>" per line, pinned with `opam pin add <name> <url> -yn`. Kept out of the .opam files because opam-repository rejects pin-depends.
    default: ''
  with-test:
    description: "'true' adds --with-test to the dependency install."
    default: 'true'
  with-doc:
    description: "'true' adds --with-doc to the dependency install."
    default: 'false'
  with-dev-setup:
    description: "'true' adds --with-dev-setup to the dependency install."
    default: 'false'
  extra-packages:
    description: Space-separated packages installed together with the dependencies, so the cache holds them.
    default: ''
  opam-disable-sandboxing:
    description: Passed to ocaml/setup-ocaml.
    default: 'true'

outputs:
  cache-hit:
    description: "'true' when the exact opam cache key was restored."
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-matched-key:
    description: Key of the restored opam cache. Empty on a full miss.
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    # One step owns the key: restore and save must agree on it. It also
    # validates pins, so a bad line fails before any restore or install work.
    - name: Compute opam cache key
      id: key
      shell: bash
      env:
        PINS: ${{ inputs.pins }}
        WITH_TEST: ${{ inputs.with-test }}
        WITH_DOC: ${{ inputs.with-doc }}
        WITH_DEV_SETUP: ${{ inputs.with-dev-setup }}
        EXTRAS: ${{ inputs.extra-packages }}
        OPAM_FILES_HASH: ${{ hashFiles('*.opam') }}
        PREFIX: opam-${{ runner.os }}-${{ runner.arch }}-${{ inputs.ocaml-compiler }}-setup-ocaml-3.9.0-
      run: |
        n=0
        while read -r name url extra; do
          n=$((n + 1))
          if [[ -z "$name$url$extra" ]]; then continue; fi
          if [[ -z "$url" || -n "$extra" ]]; then
            echo "::error::pins line $n must be '<name> <url>' (two fields): $name $url $extra"
            exit 1
          fi
        done <<< "$PINS"

        # macOS has no sha256sum.
        if command -v sha256sum > /dev/null; then sha=(sha256sum); else sha=(shasum -a 256); fi
        digest="$(printf '%s\n' "$PINS" "$WITH_TEST" "$WITH_DOC" "$WITH_DEV_SETUP" "$EXTRAS" "$OPAM_FILES_HASH" | "${sha[@]}")"
        echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
        echo "key=$PREFIX${digest%% *}" >> "$GITHUB_OUTPUT"

    # Same as setup-ocaml before its own restore: without it, the Cygwin
    # symlinks in the cache do not resolve. A restore onto an already
    # populated tree fails on Windows, so call this action once per job.
    - name: Allow symlink evaluation
      if: runner.os == 'Windows'
      shell: bash
      run: fsutil behavior set symlinkEvaluation R2L:1 R2R:1

    - name: Load opam cache
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ runner.tool_cache }}/opam
          ~/.opam
          C:\.opam
          _opam
          .opam-dir
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Use OCaml ${{ inputs.ocaml-compiler }}
      if: steps.restore.outputs.cache-matched-key == ''
      uses: ocaml/setup-ocaml@v3.9.0
      with:
        ocaml-compiler: ${{ inputs.ocaml-compiler }}
        opam-disable-sandboxing: ${{ inputs.opam-disable-sandboxing }}

    # The cache holds no PATH, so a restoring run needs to know where opam
    # lives. On Windows the runner reads GITHUB_PATH, so it needs that form.
    - name: Record opam directory
      if: steps.restore.outputs.cache-matched-key == ''
      shell: bash
      run: |
        dir="$(dirname "$(command -v opam)")"
        if [[ "$RUNNER_OS" == "Windows" ]]; then cygpath -w "$dir" > .opam-dir; else echo "$dir" > .opam-dir; fi

    - name: Use cached opam environment
      if: steps.restore.outputs.cache-matched-key != ''
      shell: bash
      run: |
        # https://github.com/ocaml/setup-ocaml/blob/v3.4.6/packages/setup-ocaml/src/installer.ts
        echo "OPAMCOLOR=always"                    >> "$GITHUB_ENV"
        echo "OPAMCONFIRMLEVEL=unsafe-yes"         >> "$GITHUB_ENV"
        echo "OPAMDOWNLOADJOBS=4"                  >> "$GITHUB_ENV"
        echo "OPAMERRLOGLEN=0"                     >> "$GITHUB_ENV"
        echo "OPAMEXTERNALSOLVER=builtin-0install" >> "$GITHUB_ENV"
        echo "OPAMPRECISETRACKING=1"               >> "$GITHUB_ENV"
        echo "OPAMRETRIES=10"                      >> "$GITHUB_ENV"
        echo "OPAMSOLVERTIMEOUT=600"               >> "$GITHUB_ENV"
        echo "OPAMYES=1"                           >> "$GITHUB_ENV"
        echo "CLICOLOR_FORCE=1"                    >> "$GITHUB_ENV"

        OPAM_DIR="$(cat .opam-dir)"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "HOME=$USERPROFILE"                           >> "$GITHUB_ENV"
          echo 'OPAMROOT=C:\.opam'                           >> "$GITHUB_ENV"
          echo 'BASH_ENV=C:\.opam\.cygwin\root\bash_env'     >> "$GITHUB_ENV"
          echo "MSYS=winsymlinks:native"                     >> "$GITHUB_ENV"
          echo "CYGWIN=winsymlinks:native"                   >> "$GITHUB_ENV"
          echo "$OPAM_DIR"                                   >> "$GITHUB_PATH"
          echo 'C:\.opam\.cygwin\root\bin'                   >> "$GITHUB_PATH"
        else
          echo "OPAMROOT=$HOME/.opam"                        >> "$GITHUB_ENV"
          chmod +x "$OPAM_DIR/opam"
          echo "$OPAM_DIR"                                   >> "$GITHUB_PATH"
        fi

    - name: Install opam dependencies
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        PINS: ${{ inputs.pins }}
        WITH_TEST: ${{ inputs.with-test }}
        WITH_DOC: ${{ inputs.with-doc }}
        WITH_DEV_SETUP: ${{ inputs.with-dev-setup }}
        EXTRAS: ${{ inputs.extra-packages }}
        STALE_RESTORE: ${{ steps.restore.outputs.cache-matched-key != '' }}
      run: |
        while read -r name url _; do
          if [[ -z "$name" ]]; then continue; fi
          opam pin add "$name" "$url" -yn
        done <<< "$PINS"

        # A stale prefix restore carries an old repository index.
        if [[ "$STALE_RESTORE" == "true" ]]; then opam update; fi

        flags=()
        if [[ "$WITH_TEST" == "true" ]]; then flags+=(--with-test); fi
        if [[ "$WITH_DOC" == "true" ]]; then flags+=(--with-doc); fi
        if [[ "$WITH_DEV_SETUP" == "true" ]]; then flags+=(--with-dev-setup); fi
        read -r -a extras <<< "$EXTRAS"
        opam install . --deps-only "${flags[@]}" "${extras[@]}"

    - name: Save opam cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ runner.tool_cache }}/opam
          ~/.opam
          C:\.opam
          _opam
          .opam-dir
        key: ${{ steps.key.outputs.key }}
