name: OCaml CI setup
description: Restore or build a cached opam switch, then export its environment.

inputs:
  ocaml-compiler:
    description: OCaml compiler version, passed to ocaml/setup-ocaml.
    required: true
  pins:
    description: |
      One "<name> <url>" per line, pinned with `opam pin add <name> <url> -yn`. Kept out of the .opam files because opam-repository rejects pin-depends.
    default: ''
  with-test:
    description: "'true' adds --with-test to the dependency install."
    default: 'true'
  with-doc:
    description: "'true' adds --with-doc to the dependency install."
    default: 'false'
  with-dev-setup:
    description: "'true' adds --with-dev-setup to the dependency install."
    default: 'false'
  extra-packages:
    description: Space-separated packages installed together with the dependencies, so the cache holds them.
    default: ''

outputs:
  cache-hit:
    description: "'true' when this call restored the exact opam cache key, else 'false'. A second call in the same job skips the restore and reports 'false'."
    value: ${{ steps.restore.outputs.cache-hit == 'true' && 'true' || 'false' }}

runs:
  using: composite
  steps:
    - name: Compute opam cache key
      id: key
      shell: bash
      env:
        PINS: ${{ inputs.pins }}
        OPTS: >-
          ${{ inputs.with-test == 'true' && '--with-test' || '' }}
          ${{ inputs.with-doc == 'true' && '--with-doc' || '' }}
          ${{ inputs.with-dev-setup == 'true' && '--with-dev-setup' || '' }}
          ${{ inputs.extra-packages }}
        COMPILER: ${{ inputs.ocaml-compiler }}
        OPAM_FILES_HASH: ${{ hashFiles('*.opam', '*.opam.locked', 'dune-project') }}
      run: |
        image="${ImageOS:-$(. /etc/os-release 2>/dev/null; echo "${ID:-}-${VERSION_ID:-}")}"
        version="$(sed -n 's|^ *uses: ocaml/setup-ocaml@v\([0-9][0-9.]*[0-9]\).*|\1|p' "$GITHUB_ACTION_PATH/action.yml")"
        if [[ -z "$version" ]]; then echo "::error::no ocaml/setup-ocaml@v<version> in $GITHUB_ACTION_PATH/action.yml"; exit 1; fi
        prefix="opam-$RUNNER_OS-$RUNNER_ARCH-$image-$COMPILER-setup-ocaml-$version-"
        refs=""
        while read -r _ url _; do
          if [[ "$url" != *://* && "$url" != git@* ]]; then continue; fi
          repo="${url#git+}"
          ref=HEAD
          if [[ "$repo" == *#* ]]; then ref="${repo#*#}"; repo="${repo%%#*}"; fi
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then refs+="$(git ls-remote "$repo" "$ref")"$'\n'; fi
        done <<< "$PINS"

        if command -v sha256sum > /dev/null; then sha=(sha256sum); else sha=(shasum -a 256); fi
        digest="$(printf '%s\n' "$PINS" "$refs" "$OPTS" "$OPAM_FILES_HASH" "${ImageVersion:-}" "$(date -u +%Y-%m)" | "${sha[@]}")"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix${digest%% *}" >> "$GITHUB_OUTPUT"
        echo "opts=${OPTS//$'\n'/ }" >> "$GITHUB_OUTPUT"
        if [[ "${GH_CI_OCAML_READY:-}" == "$COMPILER" ]]; then echo "again=true" >> "$GITHUB_OUTPUT"; fi

    - name: Allow native symlinks
      if: runner.os == 'Windows'
      shell: bash
      run: |
        fsutil behavior set symlinkEvaluation R2L:1 R2R:1
        echo "HOME=$USERPROFILE"         >> "$GITHUB_ENV"
        echo "MSYS=winsymlinks:native"   >> "$GITHUB_ENV"
        echo "CYGWIN=winsymlinks:native" >> "$GITHUB_ENV"

    - name: Load opam cache
      id: restore
      if: steps.key.outputs.again != 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ runner.tool_cache }}/opam
          ~/.opam
          C:\.opam
          _opam
          .opam-dir
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Use OCaml ${{ inputs.ocaml-compiler }}
      if: steps.key.outputs.again != 'true' && steps.restore.outputs.cache-matched-key == ''
      uses: ocaml/setup-ocaml@v3.9.0
      with:
        ocaml-compiler: ${{ inputs.ocaml-compiler }}
        opam-disable-sandboxing: true
        cache: false

    - name: Use cached opam environment
      if: steps.restore.outputs.cache-matched-key != ''
      shell: bash
      run: |
        # Same values as setup-ocaml v3.9.0 (src/installer.ts).
        echo "OPAMCONFIRMLEVEL=unsafe-yes"         >> "$GITHUB_ENV"
        echo "OPAMDOWNLOADJOBS=$(nproc 2> /dev/null || sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
        echo "OPAMEXTERNALSOLVER=builtin-0install" >> "$GITHUB_ENV"
        echo "OPAMPRECISETRACKING=1"               >> "$GITHUB_ENV"
        echo "OPAMRETRIES=10"                      >> "$GITHUB_ENV"
        echo "OPAMSOLVERTIMEOUT=600"               >> "$GITHUB_ENV"
        echo "OPAMYES=1"                           >> "$GITHUB_ENV"

        cat .opam-dir >> "$GITHUB_PATH"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo 'OPAMROOT=C:\.opam'                       >> "$GITHUB_ENV"
          echo 'BASH_ENV=C:\.opam\.cygwin\root\bash_env' >> "$GITHUB_ENV"
          echo 'C:\.opam\.cygwin\root\bin'               >> "$GITHUB_PATH"
        fi

    - name: Install opam dependencies
      shell: bash
      env:
        COMPILER: ${{ inputs.ocaml-compiler }}
        PINS: ${{ inputs.pins }}
        OPTS: ${{ steps.key.outputs.opts }}
        AGAIN: ${{ steps.key.outputs.again }}
        HIT: ${{ steps.restore.outputs.cache-hit }}
        MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        echo "GH_CI_OCAML_READY=$COMPILER" >> "$GITHUB_ENV"
        read -r -a opts <<< "$OPTS"

        # The cache holds no PATH, so a restoring run reads opam's directory
        # from here. GITHUB_PATH needs the Windows form.
        if [[ -z "$MATCHED" && "$AGAIN" != "true" ]]; then
          dir="$(dirname "$(command -v opam)")"
          if [[ "$RUNNER_OS" == "Windows" ]]; then dir="$(cygpath -w "$dir")"; fi
          echo "$dir" > .opam-dir
        fi

        if [[ "$HIT" == "true" ]]; then
          # Empty apt lists on a fresh runner: opam only warns.
          if [[ "$RUNNER_OS" == "Linux" ]]; then opam update --depexts; fi
          opam install . --deps-only --depext-only "${opts[@]}"
          exit 0
        fi

        while read -r name url extra; do
          if [[ -z "$name" ]]; then continue; fi
          if [[ -z "$url" || -n "$extra" ]]; then
            echo "::error::pins line must be '<name> <url>': $name $url $extra"
            exit 1
          fi
          opam pin add "$name" "$url" -yn
        done <<< "$PINS"

        if [[ -n "$MATCHED" ]]; then opam update; fi
        tries=1
        if [[ "$RUNNER_OS" == "Windows" ]]; then tries=3; fi
        for i in $(seq "$tries"); do
          if opam install . --deps-only "${opts[@]}"; then break; fi
          if (( i == tries )); then exit 1; fi
          sleep 10
        done
        if [[ "$AGAIN" != "true" ]]; then
          opam clean --all-switches --download-cache --logs --repo-cache --untracked --unused-repositories
        fi

    - name: Save opam cache
      if: steps.key.outputs.again != 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ runner.tool_cache }}/opam
          ~/.opam
          C:\.opam
          _opam
          .opam-dir
        key: ${{ steps.key.outputs.key }}
