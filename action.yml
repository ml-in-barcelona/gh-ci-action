name: OCaml CI setup
description: Restore or build a cached opam switch, then export its environment.

inputs:
  ocaml-compiler:
    description: OCaml compiler version, passed to ocaml/setup-ocaml.
    required: true
  install:
    description: Command that installs the project dependencies. Runs only when the exact cache key is missing.
    default: make install
  cache-key-files:
    description: Newline-separated hashFiles patterns. A change in any file starts a new switch.
    default: |
      *.opam
      dune-project
      Makefile
  opam-disable-sandboxing:
    description: Passed to ocaml/setup-ocaml.
    default: 'true'

outputs:
  cache-hit:
    description: "'true' when the exact opam cache key was restored."
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-matched-key:
    description: Key of the restored opam cache. Empty on a full miss.
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    # One step owns the key: restore and save must agree on it.
    # hashFiles joins its arguments with newlines and splits them again, so one
    # newline-separated input behaves like several arguments.
    - name: Compute opam cache key
      id: key
      shell: bash
      run: |
        echo "prefix=opam-${{ runner.os }}-${{ runner.arch }}-${{ inputs.ocaml-compiler }}-setup-ocaml-3.9.0-" >> "$GITHUB_OUTPUT"
        echo "key=opam-${{ runner.os }}-${{ runner.arch }}-${{ inputs.ocaml-compiler }}-setup-ocaml-3.9.0-${{ hashFiles(inputs.cache-key-files) }}" >> "$GITHUB_OUTPUT"

    - name: Load opam cache
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ runner.tool_cache }}/opam
          ~/.opam
          _opam
          .opam-path
          C:\cygwin
          C:\.opam
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Use OCaml ${{ inputs.ocaml-compiler }}
      if: steps.restore.outputs.cache-matched-key == ''
      uses: ocaml/setup-ocaml@v3.9.0
      with:
        ocaml-compiler: ${{ inputs.ocaml-compiler }}
        opam-disable-sandboxing: ${{ inputs.opam-disable-sandboxing }}

    - name: Get opam executable path
      if: steps.restore.outputs.cache-matched-key == ''
      shell: bash
      run: |
        opam_path="$(command -v opam)"
        # GITHUB_PATH needs a native Windows path, not an MSYS one.
        if [[ "$RUNNER_OS" == "Windows" ]]; then opam_path="$(cygpath -w "$opam_path")"; fi
        echo "$opam_path" > .opam-path

    - name: Use cached opam environment
      if: steps.restore.outputs.cache-matched-key != ''
      shell: bash
      run: |
        # https://github.com/ocaml/setup-ocaml/blob/v3.4.6/packages/setup-ocaml/src/installer.ts
        echo "OPAMCOLOR=always"                    >> "$GITHUB_ENV"
        echo "OPAMCONFIRMLEVEL=unsafe-yes"         >> "$GITHUB_ENV"
        echo "OPAMDOWNLOADJOBS=4"                  >> "$GITHUB_ENV"
        echo "OPAMERRLOGLEN=0"                     >> "$GITHUB_ENV"
        echo "OPAMEXTERNALSOLVER=builtin-0install" >> "$GITHUB_ENV"
        echo "OPAMPRECISETRACKING=1"               >> "$GITHUB_ENV"
        echo "OPAMRETRIES=10"                      >> "$GITHUB_ENV"
        echo "OPAMSOLVERTIMEOUT=600"               >> "$GITHUB_ENV"
        echo "OPAMYES=1"                           >> "$GITHUB_ENV"
        echo "CLICOLOR_FORCE=1"                    >> "$GITHUB_ENV"

        if [[ "$RUNNER_OS" != "Windows" ]]; then
          echo "OPAMROOT=$HOME/.opam" >> "$GITHUB_ENV"
        else
          echo "OPAMROOT=C:\\.opam" >> "$GITHUB_ENV"
        fi

        OPAM_PATH="$(cat .opam-path)"
        chmod +x "$OPAM_PATH"
        dirname "$OPAM_PATH" >> "$GITHUB_PATH"

        if [[ "$RUNNER_OS" == "Windows" ]]; then
          fsutil behavior set symlinkEvaluation R2L:1 R2R:1

          echo "HOME=$USERPROFILE"               >> "$GITHUB_ENV"
          echo "MSYS=winsymlinks:native"         >> "$GITHUB_ENV"
          echo "CYGWIN=winsymlinks:native"       >> "$GITHUB_ENV"
          echo "BASH_ENV=C:\\cygwin\\bash_env"   >> "$GITHUB_ENV"

          # OCaml binaries need the Cygwin DLLs on PATH.
          echo "C:\\cygwin\\bin"        >> "$GITHUB_PATH"
          echo "C:\\cygwin\\wrapperbin" >> "$GITHUB_PATH"
        fi

    - name: Install opam dependencies
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
      run: |
        # Windows downloads fail often enough to need retries.
        attempts=1
        if [[ "$RUNNER_OS" == "Windows" ]]; then attempts=3; fi
        for i in $(seq "$attempts"); do
          echo "Attempt $i of $attempts"
          if bash -e -c "$INSTALL"; then exit 0; fi
          sleep 10
        done
        exit 1

    - name: Save opam cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ runner.tool_cache }}/opam
          ~/.opam
          _opam
          .opam-path
          C:\cygwin
          C:\.opam
        key: ${{ steps.key.outputs.key }}
