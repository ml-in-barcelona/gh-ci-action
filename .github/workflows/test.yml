name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  save:
    name: Save on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # The action installs the opam files in the workspace root, so the repo
      # goes into a hidden folder (dune skips it) and the fixture becomes the
      # root project.
      - uses: actions/checkout@v4
        with:
          path: .action

      - name: Use the fixture as the project
        run: cp .action/test/fixture/* .

      - name: Setup
        uses: ./.action
        with:
          ocaml-compiler: 5.4.0
          pins: |
            ochre https://github.com/davesnx/ochre.git#f367ec7b372e20fddabc065201cf696564361abe

      - name: Dune cache
        uses: ./.action/dune-cache/load

      - name: Build and test
        run: opam exec -- dune build @runtest

      - name: Save dune cache
        uses: ./.action/dune-cache/save
        if: ${{ !cancelled() }}

  # A fresh runner, because the action must be called once per job. The
  # first job has saved the switch, so this call must hit it exactly, skip
  # setup-ocaml and still leave a working environment.
  restore:
    name: Restore on ${{ matrix.os }}
    needs: save
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          path: .action

      - name: Use the fixture as the project
        run: cp .action/test/fixture/* .

      - name: Setup
        id: setup
        uses: ./.action
        with:
          ocaml-compiler: 5.4.0
          pins: |
            ochre https://github.com/davesnx/ochre.git#f367ec7b372e20fddabc065201cf696564361abe

      - name: Check the call hit the cache
        run: test "${{ steps.setup.outputs.cache-hit }}" = "true"

      - name: Check the compiler
        run: opam exec -- ocamlc -version

      - name: Build and test
        run: opam exec -- dune build @runtest
