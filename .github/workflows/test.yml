name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # The action installs the opam files in the workspace root, so the repo
      # goes into a hidden folder (dune skips it) and the fixture becomes the
      # root project.
      - uses: actions/checkout@v4
        with:
          path: .action

      - name: Use the fixture as the project
        run: cp .action/test/fixture/* .

      - name: Setup
        uses: ./.action
        with:
          ocaml-compiler: 5.4.0
          pins: |
            ochre https://github.com/davesnx/ochre.git#f367ec7b372e20fddabc065201cf696564361abe

      - name: Dune cache
        uses: ./.action/dune-cache/load

      - name: Build and test
        run: opam exec -- dune build @runtest

      - name: Save dune cache
        uses: ./.action/dune-cache/save
        if: ${{ !cancelled() }}

      # The first call has saved the switch, so a second call must hit it
      # exactly, skip setup-ocaml and still leave a working environment.
      - name: Setup again
        id: again
        uses: ./.action
        with:
          ocaml-compiler: 5.4.0
          pins: |
            ochre https://github.com/davesnx/ochre.git#f367ec7b372e20fddabc065201cf696564361abe

      # The action's own opam cache stays skipped on Windows for now.
      - name: Check the second call cache-hit value
        env:
          EXPECTED: ${{ runner.os == 'Windows' && 'false' || 'true' }}
          ACTUAL: ${{ steps.again.outputs.cache-hit }}
        run: test "$ACTUAL" = "$EXPECTED"

      - name: Build and test again
        run: opam exec -- dune build @runtest

      # Without _build, dune can only skip its compile commands by reading the
      # shared cache. `ocamlc -config` runs on every build, so it does not count.
      - name: Check dune reads the shared cache
        run: |
          rm -rf _build
          opam exec -- dune build @runtest --trace-file=trace.json
          opam exec -- dune trace commands --trace-file=trace.json | tee commands.txt
          test "$(grep -vc -e '-config' commands.txt)" = "0"
