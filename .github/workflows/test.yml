name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  OCHRE_PIN: ochre https://github.com/davesnx/ochre.git#f367ec7b372e20fddabc065201cf696564361abe

jobs:
  save:
    name: Save on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # dune skips hidden folders, so the action goes in .action and the
      # fixture becomes the root project.
      - uses: actions/checkout@v7
        with:
          path: .action

      - run: cp .action/test/fixture/* .

      - name: Setup
        uses: ./.action
        with:
          ocaml-compiler: 5.4.0
          pins: ${{ env.OCHRE_PIN }}
          extra-packages: cppo

      - name: Check the extra package is installed
        run: opam exec -- cppo -version

      - uses: ./.action/dune-cache/load

      - run: opam exec -- dune build @runtest

      - uses: ./.action/dune-cache/save

      - name: Setup again
        id: again
        uses: ./.action
        with:
          ocaml-compiler: 5.4.0
          pins: ${{ env.OCHRE_PIN }}
          extra-packages: cppo

      - name: Check the second call cache-hit value
        run: test "${{ steps.again.outputs.cache-hit }}" = "false"

      # Without _build, dune skips its commands only by reading the shared
      # cache. `ocamlc -config` runs on every build, so it does not count.
      - name: Check dune reads the shared cache
        run: |
          rm -rf _build
          opam exec -- dune build @runtest --trace-file=trace.json
          test "$(opam exec -- dune trace commands --trace-file=trace.json | grep -vc -e '-config')" = "0"

  restore:
    name: Restore on ${{ matrix.os }}
    needs: save
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          path: .action

      - run: cp .action/test/fixture/* .

      - name: Setup
        id: setup
        uses: ./.action
        with:
          ocaml-compiler: 5.4.0
          pins: ${{ env.OCHRE_PIN }}
          extra-packages: cppo

      - name: Check the exact cache hit
        run: test "${{ steps.setup.outputs.cache-hit }}" = "true"

      - name: Check the extra package is restored
        run: opam exec -- cppo -version

      - run: opam exec -- dune build @runtest
