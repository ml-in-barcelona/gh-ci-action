name: Dune cache save
description: When the dune cache grew, trim it and save it. Run after dune-cache/load and the build steps.

inputs:
  max-size:
    description: Size limit passed to `dune cache trim --size`.
    default: 2GB

runs:
  using: composite
  steps:
    - name: Trim dune cache
      id: trim
      shell: bash
      env:
        MAX_SIZE: ${{ inputs.max-size }}
      run: |
        if [[ -z "${DUNE_CACHE_ROOT:-}" ]]; then
          echo "::notice::dune-cache/load did not run, so the dune cache is not saved."
          exit 0
        fi
        kb="$(du -sk "$DUNE_CACHE_ROOT" | cut -f1)"
        if (( kb <= DUNE_CACHE_KB_BEFORE + 1024 )); then exit 0; fi
        opam exec -- dune cache trim --size="$MAX_SIZE"
        echo "grown=1" >> "$GITHUB_OUTPUT"

    - name: Save dune cache
      if: steps.trim.outputs.grown == '1'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.DUNE_CACHE_ROOT }}
        key: ${{ env.DUNE_CACHE_KEY }}
